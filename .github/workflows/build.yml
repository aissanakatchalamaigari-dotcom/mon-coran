name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q mon_coran_complet.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Creer le projet Android
        working-directory: mon_coran
        run: |
          flutter create --platforms=android --project-name mon_coran --org com.moncoran .
          python3 tools/patch_android.py
          rm -rf test
      - name: Forcer compileSdk 36 pour les plugins
        working-directory: mon_coran
        run: |
          python3 - <<'PY'
          import pathlib
          kts_snip = '''subprojects {
              if (project.name != "app") {
                  afterEvaluate {
                      project.extensions.findByName("android")?.let { ext ->
                          ext.withGroovyBuilder { "compileSdkVersion"(36) }
                      }
                  }
              }
          }

          '''
          grv_snip = '''subprojects {
              if (project.name != 'app') {
                  afterEvaluate { p ->
                      if (p.hasProperty('android')) {
                          p.android.compileSdkVersion 36
                      }
                  }
              }
          }

          '''
          for name, snip in (('android/build.gradle.kts', kts_snip), ('android/build.gradle', grv_snip)):
              p = pathlib.Path(name)
              if p.exists():
                  p.write_text(snip + p.read_text())
                  print('patched', name)
          PY
      - name: Compiler l'APK
        working-directory: mon_coran
        run: |
          flutter pub get
          flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: mon-coran-apk
          path: mon_coran/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: admin-et-sql
          path: |
            mon_coran/admin/index.html
            mon_coran/supabase/schema.sql
